name: collection-install-selection-test

on:
  pull_request:
    paths:
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/test_install_assets_selection.py"
      - ".github/workflows/collection-continuous.yml"
      - ".github/workflows/collection-install-selection-test.yml"
  push:
    branches: [main]
    paths:
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/test_install_assets_selection.py"
      - ".github/workflows/collection-continuous.yml"
      - ".github/workflows/collection-install-selection-test.yml"

permissions:
  contents: read

concurrency:
  group: collection-install-selection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile installer and regression tests
        run: python -m py_compile COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/test_install_assets_selection.py
      - name: Verify bounded, license-gated install selection
        working-directory: COLLECTION/AUTO
        run: python test_install_assets_selection.py
      - name: Check patch whitespace
        run: git diff --check
