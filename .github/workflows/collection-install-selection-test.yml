name: collection-install-selection-test

on:
  pull_request:
    paths:
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/collection_value_operator.py"
      - "COLLECTION/SECURITY/SOURCE-QUARANTINE.json"
      - "COLLECTION/AUTO/test_install_assets_selection.py"
      - "COLLECTION/AUTO/validate_installation_outcome.py"
      - "COLLECTION/AUTO/test_installation_outcome.py"
      - "COLLECTION/AUTO/audit_large_collection_json.py"
      - "COLLECTION/AUTO/test_audit_large_collection_json.py"
      - "COLLECTION/AUTO/deep_extract.py"
      - "COLLECTION/AUTO/test_deep_extract_owner_parser.py"
      - ".github/workflows/collection-continuous.yml"
      - ".github/workflows/collection-install-selection-test.yml"
  push:
    branches: [main]
    paths:
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/collection_value_operator.py"
      - "COLLECTION/SECURITY/SOURCE-QUARANTINE.json"
      - "COLLECTION/AUTO/test_install_assets_selection.py"
      - "COLLECTION/AUTO/validate_installation_outcome.py"
      - "COLLECTION/AUTO/test_installation_outcome.py"
      - "COLLECTION/AUTO/deep_extract.py"
      - "COLLECTION/AUTO/test_deep_extract_owner_parser.py"
      - ".github/workflows/collection-continuous.yml"
      - ".github/workflows/collection-install-selection-test.yml"

permissions:
  contents: read

concurrency:
  group: collection-install-selection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile installer and regression tests
        run: python -m py_compile COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/collection_value_operator.py COLLECTION/AUTO/test_install_assets_selection.py COLLECTION/AUTO/validate_installation_outcome.py COLLECTION/AUTO/test_installation_outcome.py COLLECTION/AUTO/audit_large_collection_json.py COLLECTION/AUTO/test_audit_large_collection_json.py COLLECTION/AUTO/deep_extract.py COLLECTION/AUTO/test_deep_extract_owner_parser.py
      - name: Verify owner URL parser
        run: python -m unittest COLLECTION/AUTO/test_deep_extract_owner_parser.py
      - name: Verify explicit approval and integration/security gates
        working-directory: COLLECTION/AUTO
        run: python test_install_assets_selection.py
      - name: Verify persisted installation outcome gate
        working-directory: COLLECTION/AUTO
        run: python test_installation_outcome.py
      - name: Verify read-only audit for large generated JSON
        working-directory: COLLECTION/AUTO
        run: python test_audit_large_collection_json.py
      - name: Check patch whitespace
        run: git diff --check
