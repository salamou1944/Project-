name: Hyperswitch Callable Smoke

on:
  push:
    paths:
      - "COLLECTION/INSTALLED/juspay__hyperswitch/**"
      - ".github/workflows/hyperswitch-callable-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Cargo metadata
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        run: cargo metadata --no-deps --format-version 1 > /tmp/hyperswitch-metadata.json

      - name: Euclid deterministic smoke
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        run: cargo test -p euclid --lib

      - name: Euclid routing decision smoke
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        run: cargo bench -p euclid --features "ast_parser valued_jit" --bench backends -- --sample-size 10

      - name: Record callable evidence
        shell: bash
        run: |
          mkdir -p COLLECTION/VERIFICATION
          cat > COLLECTION/VERIFICATION/HYPERSWITCH-CALLABLE-EVIDENCE.json <<'EOF'
          {
            "schema_version": "collection-hyperswitch-callable-evidence/v1",
            "repo": "juspay/hyperswitch",
            "revision": "1d71d94d2e2e1c72f3ede13abebc24132997685f",
            "installed_path": "COLLECTION/INSTALLED/juspay__hyperswitch",
            "capability": "euclid_deterministic_library_execution",
            "entrypoint": "cargo test -p euclid --lib",
            "external_payment_network": false,
            "secrets_required": false,
            "execution_status": "PROVEN_CALLABLE_IF_JOB_SUCCEEDS",
            "routing_execution_entrypoint": "cargo bench -p euclid --features \"ast_parser valued_jit\" --bench backends -- --sample-size 10",
            "routing_smoke": "executes InterpreterBackend and VirInterpreterBackend against parsed routing rules without external payment network"
          }
          EOF

      - name: Commit evidence
        run: |
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/VERIFICATION/HYPERSWITCH-CALLABLE-EVIDENCE.json
          git diff --cached --quiet || git commit -m "chore(collection): record hyperswitch callable smoke evidence"
          git push

      # Trigger revision: preserves the same gate while forcing a fresh push event.
      - name: Gate revision marker
        run: echo "hyperswitch-callable-smoke-v3"
