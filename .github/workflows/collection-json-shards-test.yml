name: Collection JSON shard IO tests

on:
  push:
    branches:
      - "fix/collection-shard-pipeline-2026-10-27"
    paths:
      - "COLLECTION/AUTO/collection_json_io.py"
      - "COLLECTION/AUTO/test_collection_json_io.py"
      - ".github/workflows/collection-json-shards-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "COLLECTION/AUTO/collection_json_io.py"
      - "COLLECTION/AUTO/test_collection_json_io.py"
      - ".github/workflows/collection-json-shards-test.yml"

permissions:
  contents: read

jobs:
  json-shard-io:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run shard round-trip, hash, and git-baseline tests
        run: python3 COLLECTION/AUTO/test_collection_json_io.py
