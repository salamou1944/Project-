name: collection-canonical-reconciliation

on:
  push:
    paths:
      - "COLLECTION/ACCOUNTS/**"
      - "COLLECTION/SOURCES/**"
      - "COLLECTION/INDEX.md"
      - "COLLECTION/AUTO/*.py"
      - ".github/workflows/collection-canonical-reconciliation.yml"
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Collection extraction and canonical reconciliation
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile COLLECTION/AUTO/intelligent_extract.py COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/reconcile_canonical_skills.py COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/intelligent_extract.py
          python3 COLLECTION/AUTO/process_collection.py
          python3 COLLECTION/AUTO/reconcile_canonical_skills.py

      - name: Enforce terminal decision and readiness integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("COLLECTION/MASTER/CANONICAL-PROMOTION-PLAN.json").read_text())
          allowed={"NEW","UPGRADE","MERGE","REFERENCE","QUARANTINE","REVIEW_NEW_OR_UPGRADE"}
          bad=[x for x in p["items"] if x.get("terminal_decision") not in allowed]
          if bad:
              raise SystemExit("Invalid promotion decision(s): "+", ".join(x.get("capability_key","?") for x in bad))
          print(json.dumps(p["summary"],sort_keys=True))
          PY
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py

      - name: Canonical reconciliation is verification-only
        run: |
          set -euo pipefail
          echo "Canonical reconciliation verified; continuous workflow owns repository writes."
