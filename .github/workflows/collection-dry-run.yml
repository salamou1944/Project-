name: Collection Atomic Dry Run

on:
  push:
    paths:
      - "COLLECTION/DIAGNOSTICS/collection_atomic_dry_run.py"
      - ".github/workflows/collection-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collection-atomic-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile dry-run verifier
        run: python3 -m py_compile COLLECTION/DIAGNOSTICS/collection_atomic_dry_run.py
      - name: Walk Collection pipeline read-only and stop at first blocker
        run: python3 COLLECTION/DIAGNOSTICS/collection_atomic_dry_run.py
