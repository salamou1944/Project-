name: collection-ready-json-integrity-audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collection-ready-json-integrity-audit.yml"
      - "COLLECTION/AUTO/audit_ready_json_integrity.py"
      - "COLLECTION/MASTER/READY.json"
      - "COLLECTION/AUTO/EXTRACTED/MANIFEST.json"
      - "COLLECTION/AUTO/EXTRACTED/HISTORY/**"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit whose READY.json change should be audited"
        required: true
        default: "0d824d436b4e2a3c01ef6115c266f32c8e48f836"
        type: string

permissions:
  contents: read

jobs:
  compare-ready-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare parsed READY.json data before and after the target commit
        env:
          TARGET_COMMIT: ${{ inputs.commit_sha || '0d824d436b4e2a3c01ef6115c266f32c8e48f836' }}
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          python3 COLLECTION/AUTO/audit_ready_json_integrity.py "${TARGET_COMMIT}"
