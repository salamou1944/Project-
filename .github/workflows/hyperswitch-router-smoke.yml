name: Hyperswitch Router Library Smoke

on:
  push:
    paths:
      - ".github/workflows/hyperswitch-router-smoke.yml"
      - "COLLECTION/INSTALLED/juspay__hyperswitch/crates/router/**"
      - "COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperswitch-router-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout collection
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cargo metadata
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        run: cargo metadata --no-deps --format-version 1

      - name: Router deterministic unit smoke
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        run: cargo test -p router --lib test_profile_id_unavailable_initialization

      - name: Record router smoke evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir -p COLLECTION/VERIFICATION
          cat > COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json <<'EOF'
          {
            "schema_version": "collection-hyperswitch-router-smoke/v1",
            "repo": "juspay/hyperswitch",
            "revision": "1d71d94d2e2e1c72f3ede13abebc24132997685f",
            "installed_path": "COLLECTION/INSTALLED/juspay__hyperswitch",
            "capability": "router_deterministic_unit_execution",
            "entrypoint": "cargo test -p router --lib test_profile_id_unavailable_initialization",
            "external_payment_network": false,
            "secrets_required": false,
            "execution_status": "PROVEN_CALLABLE_IF_JOB_SUCCEEDS",
            "workflow_run": "${{ github.run_id }}",
            "workflow_attempt": "${{ github.run_attempt }}",
            "scope": "single deterministic router unit test; no DB/Redis dependency"
          }
          EOF

      - name: Commit evidence
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json
          git diff --cached --quiet || git commit -m "test(collection): record deterministic router smoke evidence"
          git push
