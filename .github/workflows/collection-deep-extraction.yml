name: collection-deep-extraction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "COLLECTION/ACCOUNTS/RECURSIVE_FRONTIER_*.md"
      - "COLLECTION/ACCOUNTS/RECURSIVE_ACCOUNT_FRONTIER_LAYER_A_2026-10-18.json"
      - "COLLECTION/AUTO/deep_extract.py"
      - "COLLECTION/AUTO/validate_deep_extraction.py"
      - "COLLECTION/AUTO/audit_current_collection_json.py"
  # Refresh the deep source set weekly; installation follows only a successful run.
  schedule:
    - cron: "20 3 * * 0"

concurrency:
  group: collection-writer
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deep account-wide extraction
        if: ${{ !startsWith(github.event.head_commit.message, 'audit-only:') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile COLLECTION/AUTO/deep_extract.py COLLECTION/AUTO/validate_deep_extraction.py COLLECTION/AUTO/audit_current_collection_json.py COLLECTION/AUTO/validate_current_collection_json_audit.py
          python3 COLLECTION/AUTO/deep_extract.py
          python3 COLLECTION/AUTO/validate_deep_extraction.py

      - name: Audit current JSON (also supports audit-only repair runs)
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/audit_current_collection_json.py || echo "::warning::JSON audit found parse failures; preserve the report and fail only after commit"
      - name: Commit extraction packets and current JSON audit
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/AUTO/DEEP-EXTRACTED COLLECTION/VERIFICATION/CURRENT_MAIN_JSON_AUDIT.json
          git diff --cached --quiet || git commit -m "chore(collection): refresh deep extraction and JSON audit"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent Collection state" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

      - name: Enforce persisted current JSON audit
        run: python3 COLLECTION/AUTO/validate_current_collection_json_audit.py
