name: collection-deep-extraction

on:
  push:
    paths:
      - "COLLECTION/AUTO/deep_extract.py"
      - "COLLECTION/AUTO/validate_deep_extraction.py"
      - "COLLECTION/MASTER/DEEP-EXTRACTION-GATE.md"
      - "COLLECTION/MASTER/EXTRACTION-READY.schema.json"
      - "COLLECTION/ACCOUNTS/**"
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deep account-wide extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile COLLECTION/AUTO/deep_extract.py COLLECTION/AUTO/validate_deep_extraction.py
          python3 COLLECTION/AUTO/deep_extract.py
          python3 COLLECTION/AUTO/validate_deep_extraction.py
      - name: Commit extraction packets
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/AUTO/DEEP-EXTRACTED
          git diff --cached --quiet || git commit -m "chore(collection): refresh deep extraction packets"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent Collection state" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
