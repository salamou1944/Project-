name: collection-manifest-integrity-test

on:
  pull_request:
    paths:
      - "COLLECTION/AUTO/EXTRACTED/MANIFEST.json"
      - "COLLECTION/AUTO/collection_state_guard.py"
      - "COLLECTION/AUTO/test_ready_json_compaction.py"
      - "COLLECTION/AUTO/test_collection_policy.py"
      - "COLLECTION/AUTO/process_collection.py"
      - "COLLECTION/AUTO/deep_extract.py"
      - "COLLECTION/AUTO/test_deep_extract_http_errors.py"
      - "COLLECTION/MASTER/**"
      - "COLLECTION/VERIFICATION/**"
      - ".github/workflows/collection-manifest-integrity-test.yml"
      - ".github/workflows/collection-deep-extraction.yml"
      - ".github/workflows/collection-installation.yml"
      - ".github/workflows/collection-continuous.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collection-manifest-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Collection workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "YAML_OK #{path}" }' \
            .github/workflows/collection-deep-extraction.yml \
            .github/workflows/collection-installation.yml \
            .github/workflows/collection-continuous.yml \
            .github/workflows/collection-manifest-integrity-test.yml
      - name: Compile Collection integrity checks
        run: |
          python -m py_compile \
            COLLECTION/AUTO/collection_state_guard.py \
            COLLECTION/AUTO/test_collection_policy.py \
            COLLECTION/AUTO/process_collection.py \
            COLLECTION/AUTO/deep_extract.py \
            COLLECTION/AUTO/test_deep_extract_http_errors.py
      - name: Test GitHub extraction HTTP retry and error classification
        run: python COLLECTION/AUTO/test_deep_extract_http_errors.py
      - name: Verify manifest inventory and generated-state invariants
        run: |
          python COLLECTION/AUTO/test_ready_json_compaction.py
          python COLLECTION/AUTO/collection_state_guard.py
          python COLLECTION/AUTO/test_collection_policy.py
