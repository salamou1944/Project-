name: COLLECTION Path Regression

on:
  push:
    branches: [main]
    paths:
      - "COLLECTION/AUTO/process_collection.py"
      - "COLLECTION/AUTO/test_process_collection_paths.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-and-quarantine-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pipeline and regression test
        run: python -m py_compile COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/test_process_collection_paths.py
      - name: Run path and quarantine regression tests
        working-directory: COLLECTION/AUTO
        run: python -m unittest -v test_process_collection_paths
