name: collection-commit-json-diff-audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collection-commit-json-diff-audit.yml"
      - "COLLECTION/AUTO/audit_collection_commit_json.py"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit to inspect all changed JSON files"
        required: true
        default: "0d824d436b4e2a3c01ef6115c266f32c8e48f836"
        type: string

permissions:
  contents: read

jobs:
  audit-json-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare every changed JSON file
        env:
          TARGET_COMMIT: ${{ inputs.commit_sha || '0d824d436b4e2a3c01ef6115c266f32c8e48f836' }}
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          python3 COLLECTION/AUTO/audit_collection_commit_json.py "${TARGET_COMMIT}"
