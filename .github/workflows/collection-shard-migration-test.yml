name: Collection shard migration test

on:
  pull_request:
    branches:
      - main
    paths:
      - "COLLECTION/MASTER/READY.json"
      - "COLLECTION/MASTER/PROMOTION-QUEUE.json"
      - "COLLECTION/MASTER/CANONICAL-PROMOTION-PLAN.json"
      - "COLLECTION/AUTO/collection_json_io.py"
      - "COLLECTION/AUTO/test_collection_shard_migration.py"
      - ".github/workflows/collection-shard-migration-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-state-shard-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile shard reader, writer, and migration test
        run: python3 -m py_compile COLLECTION/AUTO/collection_json_io.py COLLECTION/AUTO/test_collection_shard_migration.py
      - name: Round-trip the actual large state files without modifying repository data
        run: python3 COLLECTION/AUTO/test_collection_shard_migration.py
