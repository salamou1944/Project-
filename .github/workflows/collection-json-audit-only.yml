name: collection-json-audit-only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collection-json-audit-only.yml"
      - "COLLECTION/AUTO/audit_current_collection_json.py"

concurrency:
  group: collection-writer
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile audit tools
        run: python3 -m py_compile COLLECTION/AUTO/audit_current_collection_json.py COLLECTION/AUTO/validate_current_collection_json_audit.py
      - name: Audit current JSON without source extraction
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/audit_current_collection_json.py || echo "::warning::Parse failures are intentionally preserved for diagnosis"
      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/VERIFICATION/CURRENT_MAIN_JSON_AUDIT.json
          git diff --cached --quiet || git commit -m "chore(collection): preserve diagnostic JSON audit"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent Collection state" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
      - name: Enforce audit after report is persisted
        run: python3 COLLECTION/AUTO/validate_current_collection_json_audit.py
