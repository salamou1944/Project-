name: collection-installation

on:
  workflow_dispatch:
  # Run the fail-closed installer only after the deep extractor finishes successfully.
  workflow_run:
    workflows: ["collection-deep-extraction"]
    types: [completed]
    branches: [main]

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Confirm automatic handoff came from a successful extraction
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          test "$UPSTREAM_CONCLUSION" = "success"
          test "$UPSTREAM_WORKFLOW" = "collection-deep-extraction"

      - name: Install collected OSS sources at high throughput
        run: |
          set -euo pipefail
          python3 -m py_compile COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/verify_installed_assets.py COLLECTION/AUTO/promote_router_if_proven.py
          python3 COLLECTION/AUTO/install_assets.py --workers 4 --max-mb 250

      - name: Push installed candidates into verification gate
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/verify_installed_assets.py
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/validate_callable_registry.py
          python3 COLLECTION/AUTO/invoke_capability.py --list

      - name: Install router smoke toolchain
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install protobuf compiler for router smoke
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Hyperswitch router deterministic smoke
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        timeout-minutes: 20
        run: cargo test -p router --lib test_profile_id_unavailable_initialization

      - name: Record router smoke evidence
        if: ${{ success() && hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          mkdir -p COLLECTION/VERIFICATION
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          marker_path = Path("COLLECTION/INSTALLED/juspay__hyperswitch/.collection-install.json")
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          if marker.get("repo") != "juspay/hyperswitch" or not marker.get("revision") or marker.get("status") != "INSTALLED":
              raise SystemExit("router smoke evidence blocked: installed marker does not prove the expected source and revision")
          payload = {
              "schema_version": "collection-hyperswitch-router-smoke/v1",
              "repo": "juspay/hyperswitch",
              "revision": marker["revision"],
              "installed_path": "COLLECTION/INSTALLED/juspay__hyperswitch",
              "capability": "router_deterministic_unit_execution",
              "entrypoint": "cargo test -p router --lib test_profile_id_unavailable_initialization",
              "external_payment_network": False,
              "secrets_required": False,
              "execution_status": "PROVEN_CALLABLE",
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "single deterministic router unit test; no DB/Redis dependency"
          }
          Path("COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Promote Router only from verified evidence
        if: ${{ success() && hashFiles('COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json') != '' }}
        run: python3 COLLECTION/AUTO/promote_router_if_proven.py

      - name: Revalidate callable registry after promotion
        run: python3 COLLECTION/AUTO/validate_callable_registry.py

      - name: Commit installed assets, verification queue, router evidence, registry, and report
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/MASTER/INSTALLATION-REPORT.json COLLECTION/VERIFICATION/INSTALLED-QUEUE.json COLLECTION/MASTER/CALLABLE-REGISTRY.json
          if [ -f COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json ]; then
            git add COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json
          fi
          if [ -d COLLECTION/INSTALLED ]; then
            git add -A COLLECTION/INSTALLED
          fi
          git diff --cached --quiet || git commit -m "chore(collection): verify installed assets and queue callable review"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent Collection state" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
