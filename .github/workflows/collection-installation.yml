name: collection-installation

on:
  workflow_dispatch:
  push:
    paths:
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/verify_installed_assets.py"
      - "COLLECTION/AUTO/DEEP-EXTRACTED/MANIFEST.json"
      - "COLLECTION/SOURCES/**"
      - ".github/workflows/collection-installation.yml"
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: collection-installation
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install collected OSS sources at high throughput
        run: |
          set -euo pipefail
          # Triggered against the current installer revision so preserved-source parsing is exercised.
          python3 -m py_compile COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/verify_installed_assets.py
          python3 COLLECTION/AUTO/install_assets.py --workers 16 --max-mb 500

      - name: Push installed candidates into verification gate
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/verify_installed_assets.py
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/validate_callable_registry.py
          python3 COLLECTION/AUTO/invoke_capability.py --list

      - name: Install router smoke toolchain
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install protobuf compiler for router smoke
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Hyperswitch router deterministic smoke
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        working-directory: COLLECTION/INSTALLED/juspay__hyperswitch
        timeout-minutes: 20
        run: cargo test -p router --lib -- --skip db:: --skip types::storage::

      - name: Record router smoke evidence
        if: ${{ hashFiles('COLLECTION/INSTALLED/juspay__hyperswitch/Cargo.toml') != '' }}
        run: |
          set -euo pipefail
          mkdir -p COLLECTION/VERIFICATION
          cat > COLLECTION/VERIFICATION/HYPERSWITCH-ROUTER-SMOKE-EVIDENCE.json <<'EOF'
          {
            "schema_version": "collection-hyperswitch-router-smoke/v1",
            "repo": "juspay/hyperswitch",
            "revision": "1d71d94d2e2e1c72f3ede13abebc24132997685f",
            "installed_path": "COLLECTION/INSTALLED/juspay__hyperswitch",
            "capability": "router_deterministic_library_execution",
            "entrypoint": "cargo test -p router --lib -- --skip db:: --skip types::storage::",
            "external_payment_network": false,
            "secrets_required": false,
            "execution_status": "PROVEN_CALLABLE",
            "scope": "deterministic router library tests; infrastructure-dependent DB/Redis tests excluded"
          }
          EOF

      - name: Commit installed assets, verification queue, and report
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/MASTER/INSTALLATION-REPORT.json COLLECTION/VERIFICATION/INSTALLED-QUEUE.json
          if [ -d COLLECTION/INSTALLED ]; then
            git add -A COLLECTION/INSTALLED
          fi
          git diff --cached --quiet || git commit -m "chore(collection): verify installed assets and queue callable review"
          git push
