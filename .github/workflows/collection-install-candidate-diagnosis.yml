name: Collection install candidate diagnosis

on:
  pull_request:
    branches:
      - main
    paths:
      - "COLLECTION/AUTO/diagnose_install_selection.py"
      - "COLLECTION/AUTO/install_assets.py"
      - "COLLECTION/AUTO/collection_json_io.py"
      - "COLLECTION/AUTO/EXTRACTED/MANIFEST.json"
      - "COLLECTION/MASTER/VALUE-OPERATOR-QUEUE.json"
      - ".github/workflows/collection-install-candidate-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only diagnosis
        run: python3 -m py_compile COLLECTION/AUTO/diagnose_install_selection.py
      - name: Report authorization blockers and source-level shortlist (no installation)
        run: python3 COLLECTION/AUTO/diagnose_install_selection.py
