name: collection-continuous
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harvest public source inventories and README snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p COLLECTION/AUTO
          python - <<'PY'
          import json, os, urllib.request, datetime, time
          repos=["aw-junaid/Hacking-Tools","aw-junaid/Kali-Linux","aw-junaid/bug-bounty","aw-junaid/Black-Hat-Python","aw-junaid/Computer-Science","aw-junaid/Python-System-Administration","aw-junaid/cybersec-projects","aw-junaid/self-hostable-services","aw-junaid/Security-and-Hacking","aw-junaid/Password-Cracking","aw-junaid/programming-books","aw-junaid/Neuroscience","aw-junaid/golang-web-security","aw-junaid/Machine-Learning-For-Security","aw-junaid/android-security","aw-junaid/PHP-Web-Security","aw-junaid/Web-Security","aw-junaid/Malware-Analysis","aw-junaid/awesome","aw-junaid/Docker","aw-junaid/Algorithms","aw-junaid/DevOps-Security","aw-junaid/eBPF-in-Security","aw-junaid/Python","aw-junaid/embedded-and-iot-security","aw-junaid/Data-Visualization","aw-junaid/Assembly-Language","aw-junaid/Cpp-or-C","aw-junaid/Fuzzing-for-Security-Testing","aw-junaid/aw-junaid.github.io","aw-junaid/Quotes","mufeedvh/code2prompt","mufeedvh/moonwalk","mufeedvh/pdfrip","mufeedvh/binserve","mufeedvh/basecrack","mufeedvh/CVE-2019-8449","mufeedvh/paydept","mufeedvh/seclip","mufeedvh/gisture","mufeedvh/mnmlang","mufeedvh/regretti","mufeedvh/l33tmario","mufeedvh/maram","mufeedvh/log4jail","mufeedvh/okjson","mufeedvh/website","mufeedvh/ajnatham","mufeedvh/macmountusb","mufeedvh/bury","mufeedvh/notes","mufeedvh/cheatsheets","mufeedvh/tupperplot","mufeedvh/gofindapis","mufeedvh/zola","mufeedvh/BrokenLinkHijacking","mufeedvh/project-euler","mufeedvh/jam0001","mufeedvh/huntr","mufeedvh/SubCalc","mufeedvh/rc-zip","mufeedvh/varnamd-govarnam","mufeedvh/x86doc","mufeedvh/axum","mufeedvh/configuration","mufeedvh/pcb","mufeedvh/timers","mufeedvh/mufeedvh","mufeedvh/govarnam","mufeedvh/majeur","mufeedvh/cado-nfs","mufeedvh/mlmorph","mufeedvh/superpowers","mufeedvh/schemes","Panniantong/Agent-Reach","Panniantong/xfetch","Panniantong/agent-vault-backup","Panniantong/awesome-claude-code","Panniantong/wechat-article-for-ai","Panniantong/skillshare","Panniantong/last30days-skill","Panniantong/mcp-server-weibo","Panniantong/new-api-neo","Panniantong/openclaw","Panniantong/sub2api","Panniantong/awesome-ai-apps","Panniantong/CLIProxyAPI","Panniantong/awesome-ai-agents","Panniantong/awesome-mcp-servers","Panniantong/awesome-agents","Panniantong/gpt-researcher","Panniantong/Awesome-MCP-ZH","Panniantong/mcp-bosszp","Panniantong/guide_template","Panniantong/awesome_ai_agents","Panniantong/Awesome-AI-Agents-3","Panniantong/awesome-ai-sdks","Panniantong/awesome-ai-tools","Panniantong/WechatBot1","Panniantong/google_age_verifier","Panniantong/awesome-cursorrules","Panniantong/flux-kontext-template","Panniantong/awesome-ai-agents-1","Panniantong/WechatBot","Panniantong/RD_everything","Panniantong/ppp","Panniantong/WechatBot2","Panniantong/oss-gallery-mcp","Panniantong/neoob-images","Panniantong/awesome-ai-agents-2","Panniantong/kiro.rs","nmap/nmap","nmap/npcap","nmap/ncrack","nmap/libpcap","nmap/tcpdump","nmap/styrene","nmap/libdnet"]
          token=os.environ["GH_TOKEN"]
          def get(url):
            req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          out=[]
          for repo in repos:
            try:
              meta=get(f"https://api.github.com/repos/{repo}")
              item={"repo":repo,"default_branch":meta["default_branch"],"updated_at":meta["updated_at"],"html_url":meta["html_url"]}
              for name in ("README.md","README.MD","readme.md"):
                try:
                  d=get(f"https://api.github.com/repos/{repo}/contents/{name}?ref={meta['default_branch']}")
                  if isinstance(d,dict) and d.get("type")=="file":
                    import base64
                    item["readme_path"]=name
                    item["readme_sha"]=d.get("sha")
                    item["readme_content"]=base64.b64decode(d.get("content","")).decode("utf-8","replace")[:20000]
                    break
                except Exception:
                  pass
              out.append(item)
            except Exception as e:
              out.append({"repo":repo,"error":str(e)})
          stamp=datetime.datetime.utcnow().replace(microsecond=0).isoformat()+"Z"
          open("COLLECTION/AUTO/LATEST_PUBLIC_SOURCE_INVENTORY.json","w").write(json.dumps({"generated_at":stamp,"source_count":len(repos),"sources":out},ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Commit changes
        run: |
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/AUTO/LATEST_PUBLIC_SOURCE_INVENTORY.json
          git diff --cached --quiet || git commit -m "chore(collection): refresh public source inventory and README snapshots"
          git push
