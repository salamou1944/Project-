name: collection-continuous
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harvest public source inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p COLLECTION/AUTO
          python - <<'PY'
          import json, os, urllib.request, datetime
          repos=[
            "aw-junaid/Hacking-Tools","aw-junaid/Kali-Linux","aw-junaid/bug-bounty","aw-junaid/Black-Hat-Python",
            "mufeedvh/code2prompt","mufeedvh/binserve","mufeedvh/notes","mufeedvh/website",
            "Panniantong/Agent-Reach","Panniantong/openclaw","Panniantong/new-api-neo","Panniantong/xfetch"
          ]
          token=os.environ["GH_TOKEN"]
          out=[]
          for repo in repos:
            req=urllib.request.Request(f"https://api.github.com/repos/{repo}",headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
            with urllib.request.urlopen(req) as r: d=json.load(r)
            out.append({"repo":repo,"default_branch":d["default_branch"],"updated_at":d["updated_at"],"html_url":d["html_url"]})
          stamp=datetime.datetime.utcnow().replace(microsecond=0).isoformat()+"Z"
          open("COLLECTION/AUTO/LATEST_PUBLIC_SOURCE_INVENTORY.json","w").write(json.dumps({"generated_at":stamp,"repos":out},indent=2)+"\n")
          PY
      - name: Commit changes
        run: |
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/AUTO/LATEST_PUBLIC_SOURCE_INVENTORY.json
          git diff --cached --quiet || git commit -m "chore(collection): refresh public source inventory"
          git push
