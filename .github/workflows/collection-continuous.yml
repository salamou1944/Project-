name: collection-continuous

# Collection harvest is opt-in: manual dispatch or explicit marker push only.
# SAFE_INCREMENTAL reuses unchanged packets; FORCE_REFRESH rotates through the oldest cached packets in bounded batches.
on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Refresh the next bounded batch of cached repositories; maximum 100 repos and 1 per owner per run"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/COLLECTION_FORCE_REFRESH_ONCE"
      - ".github/COLLECTION_SAFE_INCREMENTAL_ONCE"

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded incremental Collection harvest from shared frontier
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_REQUIRE_DEEP_INVENTORY: "true"
          COLLECTION_MAX_REPOS_PER_RUN: "100"
          COLLECTION_MAX_REPOS_PER_OWNER: "1"
          COLLECTION_WORKERS: "8"
          COLLECTION_API_WORKERS: "8"
          COLLECTION_RAW_WORKERS: "12"
          COLLECTION_MAX_FILES: "24"
          COLLECTION_MAX_FILE_BYTES: "50000"
          COLLECTION_MAX_SOURCE_BYTES: "300000"
          COLLECTION_ALLOW_LEGACY_SOURCE_INSTALL: "false"
          COLLECTION_FORCE_REFRESH: ${{ (inputs.force_refresh || contains(github.event.head_commit.modified, '.github/COLLECTION_FORCE_REFRESH_ONCE') || contains(github.event.head_commit.added, '.github/COLLECTION_FORCE_REFRESH_ONCE')) && '1' || '0' }}
        run: |
          set -euo pipefail
          # Regression gate: keep READY.json readable and validate serialization before regeneration.
          python3 -m py_compile COLLECTION/AUTO/collection_json_io.py COLLECTION/AUTO/intelligent_extract.py COLLECTION/AUTO/test_intelligent_extract_batch.py COLLECTION/AUTO/test_collection_state_guard.py COLLECTION/AUTO/test_deep_extract_owner_parser.py COLLECTION/AUTO/test_extraction_cache_policy.py COLLECTION/AUTO/test_ready_json_compaction.py COLLECTION/AUTO/repair_extraction_manifest.py COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/validate_readiness.py COLLECTION/AUTO/invoke_capability.py COLLECTION/AUTO/validate_callable_registry.py COLLECTION/AUTO/callable_source_adapter.py COLLECTION/AUTO/promote_router_if_proven.py COLLECTION/AUTO/collection_state_guard.py COLLECTION/AUTO/collection_value_operator.py COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/test_install_assets_selection.py COLLECTION/AUTO/verify_installed_assets.py COLLECTION/AUTO/validate_installation_outcome.py COLLECTION/AUTO/test_installation_outcome.py COLLECTION/AUTO/audit_large_collection_json.py COLLECTION/AUTO/test_audit_large_collection_json.py COLLECTION/AUTO/audit_current_collection_json.py COLLECTION/AUTO/validate_current_collection_json_audit.py COLLECTION/AUTO/guard_ready_json_regression.py
          python3 COLLECTION/AUTO/test_collection_json_io.py
          python3 COLLECTION/AUTO/test_intelligent_extract_batch.py
          python3 COLLECTION/AUTO/test_collection_state_guard.py
          python3 COLLECTION/AUTO/test_deep_extract_owner_parser.py
          python3 COLLECTION/AUTO/test_install_assets_selection.py
          python3 COLLECTION/AUTO/test_installation_outcome.py
          python3 COLLECTION/AUTO/test_audit_large_collection_json.py
          python3 COLLECTION/AUTO/audit_large_collection_json.py
          python3 COLLECTION/AUTO/test_extraction_cache_policy.py
          python3 COLLECTION/AUTO/test_ready_json_compaction.py
          python3 COLLECTION/AUTO/intelligent_extract.py
          python3 COLLECTION/AUTO/repair_extraction_manifest.py
          python3 COLLECTION/AUTO/invoke_capability.py collection.process_collection
          python3 COLLECTION/AUTO/collection_state_guard.py
          python3 COLLECTION/AUTO/collection_value_operator.py

      # Canonical Skills reconciliation enriches the outputs but is not allowed
      # to block the core harvest -> process -> state -> value-queue cycle.
      # A failure remains visible in the Actions step and can be repaired separately.
      - name: Reconcile canonical Skills (non-blocking enrichment)
        continue-on-error: true
        run: python3 COLLECTION/AUTO/reconcile_canonical_skills.py
      - name: Recheck generated state and enforce generated JSON size budget
        run: |
          python3 COLLECTION/AUTO/collection_state_guard.py
          python3 COLLECTION/AUTO/guard_ready_json_regression.py
          python3 COLLECTION/AUTO/audit_large_collection_json.py --enforce-size

      - name: Verify Collection promotion, readiness, and callable policy
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/validate_callable_registry.py
          python3 COLLECTION/AUTO/invoke_capability.py --list

      # Only sources with explicit install approval plus passing integration/security gates may be installed.
      # Legacy source notes and deep-extraction packets remain on the shelf; installation is not runtime proof.
      - name: Install explicitly approved collected assets
        env:
          COLLECTION_ALLOW_LEGACY_SOURCE_INSTALL: "false"
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/install_assets.py --workers 2 --max-mb 50 --max-auto-candidates 2

      - name: Record post-install verification queue
        continue-on-error: true
        run: python3 COLLECTION/AUTO/verify_installed_assets.py

      - name: Revalidate Collection state after installation
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/collection_state_guard.py
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/validate_callable_registry.py
          python3 COLLECTION/AUTO/audit_current_collection_json.py || echo "::warning::JSON audit found parse failures; preserve the report and fail only after commit"

      - name: Commit extracted evidence, installed assets, and verification queue
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_REQUIRE_DEEP_INVENTORY: "true"
          COLLECTION_MAX_REPOS_PER_RUN: "100"
          COLLECTION_MAX_REPOS_PER_OWNER: "1"
          COLLECTION_WORKERS: "8"
          COLLECTION_API_WORKERS: "8"
          COLLECTION_RAW_WORKERS: "12"
          COLLECTION_MAX_FILES: "24"
          COLLECTION_MAX_FILE_BYTES: "50000"
          COLLECTION_MAX_SOURCE_BYTES: "300000"
          COLLECTION_ALLOW_LEGACY_SOURCE_INSTALL: "false"
          COLLECTION_FORCE_REFRESH: ${{ (inputs.force_refresh || contains(github.event.head_commit.modified, '.github/COLLECTION_FORCE_REFRESH_ONCE') || contains(github.event.head_commit.added, '.github/COLLECTION_FORCE_REFRESH_ONCE')) && '1' || '0' }}
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git diff --check
          git add COLLECTION/AUTO/EXTRACTED COLLECTION/MASTER COLLECTION/VERIFICATION COLLECTION/INSTALLED
          git diff --cached --quiet || git commit -m "chore(collection): refresh evidence and install prioritized assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              echo "Concurrent generated-state update detected; rebuilding from latest main" >&2
              python3 -m py_compile COLLECTION/AUTO/collection_json_io.py COLLECTION/AUTO/intelligent_extract.py COLLECTION/AUTO/test_intelligent_extract_batch.py COLLECTION/AUTO/test_collection_state_guard.py COLLECTION/AUTO/test_deep_extract_owner_parser.py COLLECTION/AUTO/test_extraction_cache_policy.py COLLECTION/AUTO/test_install_assets_selection.py COLLECTION/AUTO/repair_extraction_manifest.py COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/validate_readiness.py COLLECTION/AUTO/invoke_capability.py COLLECTION/AUTO/validate_callable_registry.py COLLECTION/AUTO/callable_source_adapter.py COLLECTION/AUTO/collection_state_guard.py COLLECTION/AUTO/collection_value_operator.py COLLECTION/AUTO/install_assets.py COLLECTION/AUTO/verify_installed_assets.py COLLECTION/AUTO/validate_installation_outcome.py COLLECTION/AUTO/test_installation_outcome.py COLLECTION/AUTO/guard_ready_json_regression.py COLLECTION/AUTO/audit_current_collection_json.py COLLECTION/AUTO/validate_current_collection_json_audit.py
              python3 COLLECTION/AUTO/test_collection_json_io.py
          python3 COLLECTION/AUTO/test_intelligent_extract_batch.py
              python3 COLLECTION/AUTO/test_collection_state_guard.py
              python3 COLLECTION/AUTO/test_deep_extract_owner_parser.py
              python3 COLLECTION/AUTO/test_install_assets_selection.py
              python3 COLLECTION/AUTO/test_installation_outcome.py
              python3 COLLECTION/AUTO/test_audit_large_collection_json.py
              python3 COLLECTION/AUTO/audit_large_collection_json.py
              python3 COLLECTION/AUTO/test_extraction_cache_policy.py
              python3 COLLECTION/AUTO/intelligent_extract.py
              python3 COLLECTION/AUTO/repair_extraction_manifest.py
              python3 COLLECTION/AUTO/invoke_capability.py collection.process_collection
              python3 COLLECTION/AUTO/collection_state_guard.py
              python3 COLLECTION/AUTO/collection_value_operator.py
              python3 COLLECTION/AUTO/reconcile_canonical_skills.py || echo "Canonical Skills enrichment failed; continuing with core Collection outputs"
              python3 COLLECTION/AUTO/collection_state_guard.py
              python3 COLLECTION/AUTO/guard_ready_json_regression.py
              python3 COLLECTION/AUTO/test_collection_policy.py
              python3 COLLECTION/AUTO/validate_readiness.py
              python3 COLLECTION/AUTO/validate_callable_registry.py
              python3 COLLECTION/AUTO/invoke_capability.py --list
              python3 COLLECTION/AUTO/install_assets.py --workers 2 --max-mb 50 --max-auto-candidates 2
              python3 COLLECTION/AUTO/verify_installed_assets.py || echo "Post-install integrity failure recorded; final outcome gate will fail after evidence commit" >&2
              python3 COLLECTION/AUTO/collection_state_guard.py
              python3 COLLECTION/AUTO/test_collection_policy.py
              python3 COLLECTION/AUTO/validate_readiness.py
              python3 COLLECTION/AUTO/validate_callable_registry.py
              python3 COLLECTION/AUTO/audit_current_collection_json.py || echo "::warning::JSON audit found parse failures; preserve the report and fail only after commit"
              git diff --check
              git add COLLECTION/AUTO/EXTRACTED COLLECTION/MASTER COLLECTION/VERIFICATION COLLECTION/INSTALLED
              git diff --cached --quiet || git commit -m "chore(collection): rebuild state and install prioritized assets"
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 5 attempts" >&2
          exit 1

      - name: Enforce persisted current JSON audit
        run: python3 COLLECTION/AUTO/validate_current_collection_json_audit.py

      # Run after the report/queue have been pushed so failures remain auditable.
      - name: Require successful install evidence or explicit no-op
        run: python3 COLLECTION/AUTO/validate_installation_outcome.py

# Manual verification trigger: run the current Collection harvester and policy checks.
# Trigger verification 2026-10-08T05:00Z
