name: collection-continuous

on:
  push:
    paths:
      - "COLLECTION/CONTROL/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run intelligent repository and gist extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/intelligent_extract.py

      - name: Commit extracted evidence and manifest
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git add COLLECTION/AUTO/EXTRACTED
          git diff --cached --quiet || git commit -m "chore(collection): refresh prioritized source extraction"
          git push
