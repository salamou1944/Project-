name: collection-continuous

on:
  push:
    branches: [main]
    paths:
      - "COLLECTION/ACCOUNTS/**"
      - "COLLECTION/SOURCES/**"
      - "COLLECTION/INDEX.md"
      - "COLLECTION/MASTER/CALLABLE-REGISTRY.json"
      - "COLLECTION/AUTO/*.py"
      - ".github/workflows/collection-continuous.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: collection-writer
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run high-throughput incremental Collection harvest
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_WORKERS: "32"
          COLLECTION_API_WORKERS: "4"
          COLLECTION_RAW_WORKERS: "32"
          COLLECTION_MAX_FILES: "24"
          COLLECTION_MAX_FILE_BYTES: "60000"
          COLLECTION_MAX_SOURCE_BYTES: "1000000"
        run: |
          set -euo pipefail
          # Regression gate: keep the large READY.json evidence graph compact without changing its JSON data.
          python3 -m py_compile COLLECTION/AUTO/intelligent_extract.py COLLECTION/AUTO/test_extraction_cache_policy.py COLLECTION/AUTO/test_ready_json_compaction.py COLLECTION/AUTO/repair_extraction_manifest.py COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/validate_readiness.py COLLECTION/AUTO/invoke_capability.py COLLECTION/AUTO/validate_callable_registry.py COLLECTION/AUTO/callable_source_adapter.py COLLECTION/AUTO/promote_router_if_proven.py COLLECTION/AUTO/collection_state_guard.py COLLECTION/AUTO/collection_value_operator.py COLLECTION/AUTO/install_assets.py
          python3 COLLECTION/AUTO/test_extraction_cache_policy.py
          python3 COLLECTION/AUTO/test_ready_json_compaction.py
          python3 COLLECTION/AUTO/intelligent_extract.py
          python3 COLLECTION/AUTO/repair_extraction_manifest.py
          python3 COLLECTION/AUTO/invoke_capability.py collection.process_collection
          python3 COLLECTION/AUTO/collection_state_guard.py
          python3 COLLECTION/AUTO/collection_value_operator.py

      # Canonical Skills reconciliation enriches the outputs but is not allowed
      # to block the core harvest -> process -> state -> value-queue cycle.
      # A failure remains visible in the Actions step and can be repaired separately.
      - name: Reconcile canonical Skills (non-blocking enrichment)
        continue-on-error: true
        run: python3 COLLECTION/AUTO/reconcile_canonical_skills.py
      - name: Recheck generated state after promotion
        run: python3 COLLECTION/AUTO/collection_state_guard.py

      - name: Verify Collection promotion, readiness, and callable policy
        run: |
          set -euo pipefail
          python3 COLLECTION/AUTO/test_collection_policy.py
          python3 COLLECTION/AUTO/validate_readiness.py
          python3 COLLECTION/AUTO/validate_callable_registry.py
          python3 COLLECTION/AUTO/invoke_capability.py --list

      - name: Commit extracted evidence and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_WORKERS: "32"
          COLLECTION_API_WORKERS: "4"
          COLLECTION_RAW_WORKERS: "32"
          COLLECTION_MAX_FILES: "24"
          COLLECTION_MAX_FILE_BYTES: "60000"
          COLLECTION_MAX_SOURCE_BYTES: "1000000"
        run: |
          set -euo pipefail
          git config user.name "collection-bot"
          git config user.email "collection-bot@users.noreply.github.com"
          git diff --check
          git add COLLECTION/AUTO/EXTRACTED COLLECTION/MASTER COLLECTION/VERIFICATION
          git diff --cached --quiet || git commit -m "chore(collection): refresh prioritized source extraction"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              echo "Concurrent generated-state update detected; rebuilding from latest main" >&2
              python3 -m py_compile COLLECTION/AUTO/intelligent_extract.py COLLECTION/AUTO/test_extraction_cache_policy.py COLLECTION/AUTO/repair_extraction_manifest.py COLLECTION/AUTO/process_collection.py COLLECTION/AUTO/validate_readiness.py COLLECTION/AUTO/invoke_capability.py COLLECTION/AUTO/validate_callable_registry.py COLLECTION/AUTO/callable_source_adapter.py COLLECTION/AUTO/collection_state_guard.py COLLECTION/AUTO/collection_value_operator.py
              python3 COLLECTION/AUTO/test_extraction_cache_policy.py
              python3 COLLECTION/AUTO/intelligent_extract.py
              python3 COLLECTION/AUTO/repair_extraction_manifest.py
              python3 COLLECTION/AUTO/invoke_capability.py collection.process_collection
              python3 COLLECTION/AUTO/collection_state_guard.py
              python3 COLLECTION/AUTO/collection_value_operator.py
              python3 COLLECTION/AUTO/reconcile_canonical_skills.py || echo "Canonical Skills enrichment failed; continuing with core Collection outputs"
              python3 COLLECTION/AUTO/collection_state_guard.py
              python3 COLLECTION/AUTO/test_collection_policy.py
              python3 COLLECTION/AUTO/validate_readiness.py
              python3 COLLECTION/AUTO/validate_callable_registry.py
              python3 COLLECTION/AUTO/invoke_capability.py --list
              git diff --check
              git add COLLECTION/AUTO/EXTRACTED COLLECTION/MASTER COLLECTION/VERIFICATION
              git diff --cached --quiet || git commit -m "chore(collection): rebuild generated state on latest main"
            fi
            sleep $((attempt * 3))
          done
          echo "Push failed after 5 attempts" >&2
          exit 1

# Manual verification trigger: run the current Collection harvester and policy checks.
# Trigger verification 2026-10-08T05:00Z
