name: collection-ready-json-semantic-audit
# Re-run after READY.json integrity findings to verify historical artifact preservation.

on:
  pull_request:
    branches: [main]
    paths:
      - "COLLECTION/AUTO/audit_ready_json_equivalence.py"
      - "COLLECTION/AUTO/collection_json_io.py"
      - ".github/workflows/collection-ready-json-semantic-audit.yml"
  push:
    branches:
      - main
    paths:
      - "COLLECTION/AUTO/audit_ready_json_equivalence.py"
      - ".github/workflows/collection-ready-json-semantic-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile semantic audit
        run: python3 -m py_compile COLLECTION/AUTO/audit_ready_json_equivalence.py COLLECTION/AUTO/collection_json_io.py
      - name: Compare parsed READY.json data across the compaction commit
        run: python3 COLLECTION/AUTO/audit_ready_json_equivalence.py
